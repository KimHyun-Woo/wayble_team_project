<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>등록 페이지</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- 뒤로가기 버튼-->
  <header class="header">
  <button class="back-btn" onclick="goBack()">←</button>
</header>

  <!-- 입력 영역 -->
  <main class="main">

    <div class="input-box">
      <label>경로 이름</label>
      <input type="text" placeholder="예: 중앙대학교 310관">
    </div>

    <div class="input-box">
      <label>주소</label>
      <input type="text" placeholder="예: 중앙대학교 310관">
    </div>

    <div class="input-box">
      <label>소개글</label>
      <input type="text" placeholder="예: 중앙대학교 310관">
    </div>

    <div class="input-box">
      <label>태그</label>
      <input type="text" placeholder="예: #중앙대, #커피, #맛집">
    </div>

  <button class="next-btn" onclick="goNext()">다음</button>
  </main>

  <!-- 하단 네비 -->
  <nav class="bottom-nav">
    <div class="nav-item">🏠<span>홈</span></div>
    <div class="nav-item">🚩<span>경로 등록</span></div>
    <div class="nav-item active">📍<span>장소 등록</span></div>
    <div class="nav-item">👤<span>계정</span></div>
  </nav>

</div>

</body>
</html>
